name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(find . -name "SaikiMotion.zip2" | head -n 1)
          mkdir -p work
          unzip -q "$ZIP" -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build
        id: build
        working-directory: work/SaikiMotion
        run: gradle assembleDebug --no-daemon > ../build.log 2>&1 || echo "failed=1" >> $GITHUB_OUTPUT
      - name: Show errors
        if: steps.build.outputs.failed == '1'
        run: |
          grep -E "^e: " work/build.log | sed 's#.*/com/saiki/motion/##' | head -40
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: SaikiMotion-APK
          path: work/SaikiMotion/app/build/outputs/apk/debug/*.apk
