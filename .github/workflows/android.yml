name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(find . -name "SaikiMotion.zip" | head -n 1)
          echo "Found zip at: $ZIP"
          mkdir -p work
          unzip -q "$ZIP" -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: work/SaikiMotion
      - uses: actions/upload-artifact@v4
        with:
          name: SaikiMotion-APK
          path: work/SaikiMotion/app/build/outputs/apk/debug/*.apk
