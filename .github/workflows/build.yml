name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      variant:
        description: Which APK to build
        type: choice
        options: [both, debug, release]
        default: both

env:
  NDK_VERSION: 26.1.10909125
  CMAKE_VERSION: 3.22.1
  LOGDIR: /tmp/saiki-logs

defaults:
  run:
    shell: bash   # bash -eo pipefail, so a failing command before `| tee` still fails the step

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Prepare log folder
        run: |
          mkdir -p "$LOGDIR"
          { echo "run: ${{ github.run_id }} / ${{ github.sha }}"; date -u; uname -a; java -version 2>&1; df -h /; } > "$LOGDIR/00-environment.log" 2>&1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Finds the Android project anywhere: in the repo, or inside any zip (even zips nested in zips).
      # If several projects are found (e.g. a stale copy) the one with the highest versionCode wins.
      - name: Locate project (unzips automatically)
        id: loc
        run: |
          python3 - <<'PY' 2>&1 | tee "$LOGDIR/01-locate.log"
          import os, re, subprocess, sys
          repo = os.environ['GITHUB_WORKSPACE']
          work = os.path.join(os.environ['RUNNER_TEMP'], 'src')
          os.makedirs(work, exist_ok=True)
          SKIP = {'build', '__MACOSX', '.git', 'node_modules', '.gradle'}

          def cands(base):
              out = []
              for d, dirs, files in os.walk(base):
                  dirs[:] = [x for x in dirs if x not in SKIP]
                  if 'settings.gradle.kts' in files or 'settings.gradle' in files:
                      for sub in os.listdir(d):
                          if os.path.isfile(os.path.join(d, sub, 'src', 'main', 'AndroidManifest.xml')):
                              out.append(d); break
              return out

          def zips(base):
              out = []
              for d, dirs, files in os.walk(base):
                  dirs[:] = [x for x in dirs if x not in SKIP]
                  out += [os.path.join(d, f) for f in files if f.lower().endswith('.zip')]
              return out

          done = set(); found = []
          for rnd in range(6):
              found = cands(repo) + cands(work)
              if found: break
              new = [z for z in zips(repo) + zips(work) if z not in done]
              if not new: break
              for i, z in enumerate(new):
                  done.add(z)
                  dest = os.path.join(work, f'z{rnd}_{i}')
                  os.makedirs(dest, exist_ok=True)
                  print('unzipping', z)
                  subprocess.run(['unzip', '-q', '-o', z, '-d', dest])
          if not found:
              sys.exit('No Android project found (need settings.gradle[.kts] + a module with src/main/AndroidManifest.xml), even inside zips.')

          def score(d):
              vc = 0
              for sub in os.listdir(d):
                  for n in ('build.gradle.kts', 'build.gradle'):
                      p = os.path.join(d, sub, n)
                      if os.path.isfile(p):
                          m = re.search(r'versionCode\s*=?\s*(\d+)', open(p, errors='ignore').read())
                          if m: vc = max(vc, int(m.group(1)))
              return (vc, os.path.isfile(os.path.join(d, 'gradlew')), -d.count(os.sep))

          found.sort(key=score, reverse=True)
          root = found[0]
          print('Candidates:', found)
          print('USING PROJECT:', root)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'root={root}\n')
          PY

      - name: Install SDK, NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          } 2>&1 | tee "$LOGDIR/02-sdk-install.log"

      - name: Configure local.properties
        run: |
          cd "${{ steps.loc.outputs.root }}"
          printf 'sdk.dir=%s\ncmake.dir=%s\n' "$ANDROID_HOME" "$ANDROID_HOME/cmake/${CMAKE_VERSION}" > local.properties
          cat local.properties | tee "$LOGDIR/03-local-properties.log"

      # The NDK ships shaderc as sources only; the app's CMake expects static libs in
      #   <ndk>/sources/third_party/shaderc/libs/c++_shared/arm64-v8a/lib*.a
      - name: Cache shaderc static libs
        id: shaderc-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/26.1.10909125/sources/third_party/shaderc/libs
          key: shaderc-ndk26.1.10909125-arm64-v8a-v2

      - name: Build shaderc libs (first run only)
        if: steps.shaderc-cache.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          SC="$NDK/sources/third_party/shaderc"
          DEST="$SC/libs/c++_shared/arm64-v8a"
          cd "$SC"
          "$NDK/ndk-build" APP_ABI=arm64-v8a APP_STL=c++_shared APP_PLATFORM=android-24 \
            NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk -j"$(nproc)" > "$LOGDIR/04-shaderc-ndk-build.log" 2>&1 || { tail -80 "$LOGDIR/04-shaderc-ndk-build.log"; exit 1; }
          {
            echo "== ndk-build output =="; ls -la obj/local/arm64-v8a || true
            mkdir -p "$DEST"
            # ndk-build leaves static libs in obj/local/<abi>; CMake wants them in libs/<stl>/<abi>
            find obj/local/arm64-v8a -maxdepth 1 -name '*.a' -exec cp -v {} "$DEST/" \;
            # libSPVRemapper.a is not produced by the NDK (SPVRemapper.cpp is inside libSPIRV.a); CMake still links it, so add an empty archive
            if [ ! -f "$DEST/libSPVRemapper.a" ]; then
              TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
              echo 'int saiki_spvremapper_stub;' > /tmp/e.c
              "$TC/aarch64-linux-android24-clang" -c /tmp/e.c -o /tmp/e.o
              "$TC/llvm-ar" rcs "$DEST/libSPVRemapper.a" /tmp/e.o
              echo "created empty libSPVRemapper.a"
            fi
            MISSING=0
            for L in shaderc shaderc_util SPIRV-Tools SPIRV-Tools-opt glslang SPIRV HLSL OGLCompiler OSDependent SPVRemapper; do
              if [ -f "$DEST/lib$L.a" ]; then echo "OK   lib$L.a"; else echo "MISSING lib$L.a"; MISSING=1; fi
            done
            ls -la "$DEST"
            [ "$MISSING" = 0 ] || { echo "shaderc libs incomplete"; exit 1; }
          } 2>&1 | tee "$LOGDIR/05-shaderc-install-libs.log"

      # Recompiles GLSL -> SPIR-V so the .spv assets always match shared/shaders/glsl.
      - name: Compile shaders
        run: |
          ROOT="${{ steps.loc.outputs.root }}"
          G="$ANDROID_HOME/ndk/${NDK_VERSION}/shader-tools/linux-x86_64/glslc"
          SRC="$ROOT/shared/shaders/glsl"
          OUT="$ROOT/app/src/main/assets/shaders"
          {
            if [ -d "$SRC" ] && ls "$SRC"/*.vert "$SRC"/*.frag > /dev/null 2>&1; then
              mkdir -p "$OUT"; n=0
              for f in "$SRC"/*.vert "$SRC"/*.frag; do
                [ -e "$f" ] || continue
                b=$(basename "$f"); stage="${b##*.}"
                echo "glslc $b"
                "$G" --target-env=vulkan1.2 -fshader-stage="$stage" "$f" -o "$OUT/${b%.*}.spv"
                n=$((n+1))
              done
              echo "compiled $n shaders"
            else
              echo "no shared/shaders/glsl here; using the precompiled .spv assets"
            fi
          } 2>&1 | tee "$LOGDIR/06-shaders.log"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "${{ steps.loc.outputs.root }}"
          case "${{ inputs.variant }}" in
            debug)   TASKS="assembleDebug" ;;
            release) TASKS="assembleRelease" ;;
            *)       TASKS="assembleDebug assembleRelease" ;;
          esac
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew; G=./gradlew
          else
            G=gradle
          fi
          $G --no-daemon --stacktrace --warning-mode all --console=plain \
             -Dorg.gradle.jvmargs=-Xmx4g $TASKS 2>&1 | tee "$LOGDIR/07-gradle-build.log"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SaikiMotion-apk
          path: ${{ steps.loc.outputs.root }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # ---------- LOGS: always uploaded, even when the build fails ----------
      - name: Extract errors summary
        if: always()
        run: |
          ROOT="${{ steps.loc.outputs.root }}"
          if [ -n "$ROOT" ] && [ -d "$ROOT" ]; then
            mkdir -p "$LOGDIR/project-reports"
            find "$ROOT" -path '*/build/reports/*' -type f \( -name '*.html' -o -name '*.txt' -o -name '*.xml' \) -size -5M -print0 2>/dev/null | head -z -n 300 | xargs -0 -I{} cp --parents {} "$LOGDIR/project-reports/" 2>/dev/null || true
            find "$ROOT" -path '*/.cxx/*' -type f \( -name '*.log' -o -name '*.txt' -o -name 'build_command.txt' \) -size -5M -print0 2>/dev/null | head -z -n 300 | xargs -0 -I{} cp --parents {} "$LOGDIR/project-reports/" 2>/dev/null || true
            find "$ROOT" -name 'hs_err_pid*.log' -exec cp {} "$LOGDIR/" \; 2>/dev/null || true
          fi
          grep -nE '^e: |^w: .*\.kt|error:|FAILURE:|What went wrong|Execution failed|> Task .* FAILED|undefined reference|ld: error|ninja: build stopped|MISSING|No Android project|Caused by:' "$LOGDIR"/*.log > "$LOGDIR/ERRORS.txt" 2>/dev/null || true
          {
            echo "## Build errors (first 120 lines; full logs are in the build-logs artifact)"
            echo '```'
            head -120 "$LOGDIR/ERRORS.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la "$LOGDIR"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: /tmp/saiki-logs/
          retention-days: 30
          if-no-files-found: warn
