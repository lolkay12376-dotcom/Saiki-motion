name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q SaikiMotion.zip -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: work/SaikiMotion
      - uses: actions/upload-artifact@v4
        with:
          name: SaikiMotion-APK
          path: work/SaikiMotion/app/build/outputs/apk/debug/*.apk
